version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: golden_agro_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: golden_agrochemicals
      MYSQL_USER: golden
      MYSQL_PASSWORD: golden123
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
